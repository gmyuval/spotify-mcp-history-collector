[project]
name = "spotify-mcp-workspace"
version = "0.1.0"
description = "Development workspace for the Spotify MCP services"
requires-python = "==3.14.*"
dependencies = [
    "spotify-history-collector",
    "spotify-mcp-api",
    "spotify-mcp-explorer",
    "spotify-mcp-frontend",
    "spotify-mcp-shared",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "mypy>=1.13.0",
    "pip==26.1.2",
    "pip-tools==7.5.3",
    "pre-commit>=4.3.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff==0.15.0",
    "types-python-dateutil",
]

[tool.uv]
required-version = "==0.12.3"
package = false

[tool.uv.sources]
spotify-history-collector = { workspace = true }
spotify-mcp-api = { workspace = true }
spotify-mcp-explorer = { workspace = true }
spotify-mcp-frontend = { workspace = true }
spotify-mcp-shared = { workspace = true }

[tool.uv.workspace]
members = [
    "services/api",
    "services/collector",
    "services/explorer",
    "services/frontend",
    "services/shared",
]

# Root-level tool configuration for monorepo development. Per-package
# pyproject.toml files remain the source of truth for package metadata.

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
# UP042 (str, Enum → StrEnum) is classified "unsafe" because StrEnum was added
# in Python 3.11 and has subtle MRO differences. We require >=3.14, so the
# migration is always correct. Promoting it to safe lets `ruff check --fix`
# handle it automatically instead of requiring `--unsafe-fixes`.
extend-safe-fixes = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Test files: pytest fixtures are referenced by name in function signatures
# but not used in the function body — this is expected pytest behaviour.
"**/tests/**" = ["ARG001"]
"**/conftest.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "shared", "collector", "frontend"]

[tool.mypy]
python_version = "3.14"
mypy_path = [
    "services/shared/src",
    "services/api/src",
    "services/collector/src",
    "services/frontend/src",
    "services/explorer/src",
]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "services/api/tests",
    "services/collector/tests",
    "services/frontend/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short -m 'not integration'"
markers = [
    "integration: requires Docker PostgreSQL at localhost:5434 (run with: pytest -m integration)",
]
