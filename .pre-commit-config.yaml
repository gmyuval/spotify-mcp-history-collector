repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy services/shared/src services/api/src services/collector/src services/frontend/src services/explorer/src
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
