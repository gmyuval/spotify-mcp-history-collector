name: CI

on:
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.14'

jobs:
  agent-contract:
    name: Agent Contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m unittest discover -s tests/contracts -p "test_*.py"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e services/shared
          pip install -e "services/api[dev]"
          pip install -e "services/collector[dev]"
          pip install -e "services/frontend[dev]"
          pip install -e "services/explorer[dev]"
      - run: mypy services/shared/src services/api/src services/collector/src services/frontend/src services/explorer/src

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e services/shared
          pip install -e "services/api[dev]"
      - run: pytest services/api/tests/

  test-collector:
    name: Test Collector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e services/shared
          pip install -e "services/collector[dev]"
      - working-directory: services/collector
        run: pytest tests/

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e services/shared
          pip install -e "services/frontend[dev]"
      - run: pytest services/frontend/tests/

  test-explorer:
    name: Test Explorer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e services/shared
          pip install -e "services/explorer[dev]"
      - run: pytest services/explorer/tests/
